services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pedidos360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pedidos360-network

  # Base de Datos Relacional Cloud Native
  postgres-db:
    image: postgres:16-alpine
    container_name: pedidos360-db
    environment:
      POSTGRES_DB: pedidos360_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos360_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-network

  # Coordinador ZooKeeper para Cluster Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pedidos360-network

  # Broker Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - pedidos360-network

  # Kafka UI: Interfaz de administracion y observabilidad
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - pedidos360-network

  # Microservicio Backend en Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedidos360-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/pedidos360_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_APP_ID_URI: ${AZURE_APP_ID_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - pedidos360-network

  rabbit-consumer:
    build:
      context: ./rabbit-consumer
      dockerfile: Dockerfile
    container_name: pedidos360-rabbit-consumer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  kafka-consumer:
    build:
      context: ./kafka-consumer
      dockerfile: Dockerfile
    container_name: pedidos360-kafka-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8084
    depends_on:
      - kafka
    networks:
      - pedidos360-network

  rabbit-admin:
    build:
      context: ./rabbit-admin
      dockerfile: Dockerfile
    container_name: pedidos360-rabbit-admin
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  kafka-admin:
    build:
      context: ./kafka-admin
      dockerfile: Dockerfile
    container_name: pedidos360-kafka-admin
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - kafka
    networks:
      - pedidos360-network

  # Frontend en Angular servido mediante Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - pedidos360-network

volumes:
  postgres_data:

networks:
  pedidos360-network:
    driver: bridge
