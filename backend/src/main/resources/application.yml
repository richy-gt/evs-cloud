server:
  port: 8080

azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:}
    client-id: ${AZURE_CLIENT_ID:}
    app-id-uri: ${AZURE_APP_ID_URI:}

spring:
  application:
    name: pedidos360-backend

  # Configuracion de Base de Datos
  # En Docker Compose o Cloud se conecta a PostgreSQL mediante variables de entorno.
  # Para pruebas locales directas sin PostgreSQL, conmuta automaticamente a H2 en memoria.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Configuracion de CORS para comunicacion con Angular
app:
  rabbit:
    exchange: pedidos.events
    retry-exchange: pedidos.retry
    dead-letter-exchange: pedidos.dlx
    routing-keys:
      notifications: pedido.created.notifications
      tickets: pedido.created.tickets
      documents: pedido.created.documents
    queues:
      notifications: pedidos.notifications
      tickets: pedidos.tickets
      documents: pedidos.documents
    retry-queues:
      notifications: pedidos.notifications.retry
      tickets: pedidos.tickets.retry
      documents: pedidos.documents.retry
    dead-letter-queues:
      notifications: pedidos.notifications.dlq
      tickets: pedidos.tickets.dlq
      documents: pedidos.documents.dlq
    retry-delay: 5000
    max-retries: 3
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:80,http://localhost,http://127.0.0.1:4200,https://172.183.130.23.sslip.io"
