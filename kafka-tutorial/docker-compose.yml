services:
  # ZooKeeper: Coordinador del cluster de Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka-tutorial-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  # Kafka Broker: El servidor de mensajeria principal
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tutorial-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configuracion hibrida para Azure VM y Local:
      # - PLAINTEXT (interno en Docker): comunica a kafka-ui y kafka-app usando 'kafka:29092'
      # - PLAINTEXT_HOST (externo): expone a localhost o la IP de Azure configurada en KAFKA_HOST
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - kafka-network

  # Kafka UI: Interfaz grafica para monitorear topics, particiones y offsets
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-tutorial-ui
    depends_on:
      - kafka
    ports:
      # Puerto 8085 por defecto para no colisionar con backend de Pedidos360 (puerto 8080)
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - kafka-network

  # Aplicacion Spring Boot Tutorial (Productor + Consumidor)
  # Permite levantar todo el laboratorio en Azure VM con un solo comando sin requerir JDK/Maven en el host
  kafka-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka-tutorial-app
    depends_on:
      - kafka
    ports:
      - "${KAFKA_APP_PORT:-8888}:8888"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORT: 8888
    networks:
      - kafka-network

networks:
  kafka-network:
    name: kafka-tutorial-network
    driver: bridge
