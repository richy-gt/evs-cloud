server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: pedidos360-kafka-consumer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "cl.duoc.pedidos360.kafka.dto"
        spring.json.value.default.type: cl.duoc.pedidos360.kafka.dto.PedidoEventKafkaDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: RECORD

app:
  kafka:
    topics:
      pedidos-stream: pedidos.streaming.eventos
      pedidos-audit: pedidos.auditoria.log
      pedidos-stream-dlt: pedidos.streaming.eventos.DLT
      pedidos-audit-dlt: pedidos.auditoria.log.DLT
    groups:
      analytics: pedidos360-analytics-group
      audit: pedidos360-audit-group
    retry:
      interval-ms: 1000
      max-attempts: 3
